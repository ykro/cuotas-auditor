<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura del Sistema — Cuotas Auditor GT</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Arquitectura Desacoplada del Auditor de Credito GT</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-gt-title arch-gt-desc">
        <title id="arch-gt-title">Arquitectura Desacoplada del Auditor de Credito GT</title>
        <desc id="arch-gt-desc">Diagrama de arquitectura que conecta la captura movil, el extractor Gemini Vision, el motor determinista Newton-Raphson y la persistencia en Firebase Firestore.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Orthogonal Connectors (drawn before nodes) -->
        <!-- N1 (Mobile UI) -> N2 (Vision Extractor) -->
        <line x1="260" y1="128" x2="368" y2="128" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="284" y="104" width="60" height="16" fill="#f5f5f5"/>
        <text x="314" y="115" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">CAPTURA</text>

        <!-- N2 (Vision Extractor) -> N3 (Gemini 3.8 Flash) -->
        <line x1="588" y1="128" x2="696" y2="128" stroke="#2e5aa8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="610" y="104" width="64" height="16" fill="#f5f5f5"/>
        <text x="642" y="115" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2e5aa8">HTTPS JSON</text>

        <!-- N2 (Vision Extractor) -> N4 (Motor Financiero creditAudit.ts) -->
        <line x1="478" y1="176" x2="478" y2="268" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <rect x="490" y="212" width="84" height="16" fill="#f5f5f5"/>
        <text x="532" y="223" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#eb6c36">OFFER INPUT</text>

        <!-- N1 (Mobile UI) -> N4 (Motor Financiero) via orthogonal elbow r=8 -->
        <path d="M 150 176 L 150 308 Q 150 316 158 316 L 368 316" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <rect x="216" y="292" width="88" height="16" fill="#f5f5f5"/>
        <text x="260" y="303" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#eb6c36">CASOS ELEKTRA</text>

        <!-- N4 (Motor Financiero) -> N5 (Firebase Auth & Firestore) -->
        <line x1="588" y1="316" x2="696" y2="316" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#arrow-link)"/>
        <rect x="608" y="292" width="68" height="16" fill="#f5f5f5"/>
        <text x="642" y="303" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2e5aa8">AUDITORIAS</text>

        <!-- N1 (Mobile UI) -> N6 (Feedback Module) -->
        <path d="M 110 176 L 110 412 Q 110 420 118 420 L 696 420" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="364" y="396" width="92" height="16" fill="#f5f5f5"/>
        <text x="410" y="407" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">3 PREGUNTAS UX</text>

        <!-- Nodes -->
        <!-- Node 1: Mobile-First React UI -->
        <rect x="40" y="80" width="220" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="52" y="92" width="56" height="18" rx="2" fill="#e8eaed"/>
        <text x="80" y="104" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">FRONTEND</text>
        <text x="52" y="132" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">UI Mobile-First React</text>
        <text x="52" y="152" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">src/App.tsx · ?guia=1</text>

        <!-- Node 2: Vision & Heuristic Extractor -->
        <rect x="368" y="80" width="220" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="380" y="92" width="56" height="18" rx="2" fill="#e8eaed"/>
        <text x="408" y="104" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">INGESTA</text>
        <text x="380" y="132" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">Extractor de Ofertas</text>
        <text x="380" y="152" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">src/services/visionExtractor.ts</text>

        <!-- Node 3: Gemini 3.8 Flash API -->
        <rect x="696" y="80" width="224" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4"/>
        <rect x="708" y="92" width="76" height="18" rx="2" fill="#e8eef7"/>
        <text x="746" y="104" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2e5aa8">EXTERNAL API</text>
        <text x="708" y="132" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">Gemini 3.8 Flash</text>
        <text x="708" y="152" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Multimodal JSON Schema</text>

        <!-- Node 4 (FOCAL): Motor Financiero Determinista -->
        <rect x="368" y="268" width="220" height="96" rx="6" fill="#fff5f0" stroke="#eb6c36" stroke-width="2"/>
        <rect x="380" y="280" width="84" height="18" rx="2" fill="#eb6c36"/>
        <text x="422" y="292" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#ffffff">CORE ENGINE</text>
        <text x="380" y="320" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">Solver Newton-Raphson</text>
        <text x="380" y="340" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">src/engine/creditAudit.ts</text>

        <!-- Node 5: Cloud Firestore (Audits) -->
        <rect x="696" y="268" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="708" y="280" width="68" height="18" rx="2" fill="#e8eaed"/>
        <text x="742" y="292" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">FIRESTORE</text>
        <text x="708" y="320" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">Historial de Auditorias</text>
        <text x="708" y="340" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">users/{uid}/credit_audits</text>

        <!-- Node 6: Cloud Firestore (Feedback) -->
        <rect x="696" y="380" width="224" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="708" y="390" width="68" height="18" rx="2" fill="#e8eaed"/>
        <text x="742" y="402" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">TELEMETRIA</text>
        <text x="708" y="428" font-family="'Geist', sans-serif" font-weight="600" font-size="15" fill="#2d3142">Feedback de Testers</text>
        <text x="708" y="446" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">prototype_feedback</text>

        <!-- Bottom Legend Strip -->
        <line x1="40" y1="492" x2="920" y2="492" stroke="#d0d4dc" stroke-width="1"/>
        <rect x="40" y="508" width="12" height="12" rx="2" fill="#fff5f0" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="60" y="518" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Motor Determinista (Focal)</text>

        <rect x="260" y="508" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
        <text x="280" y="518" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Modulo Local / Firestore</text>

        <rect x="470" y="508" width="12" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,2"/>
        <text x="490" y="518" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Servicio Opcional Externo</text>
      </svg>
    </div>
  </div>
</body>
</html>
